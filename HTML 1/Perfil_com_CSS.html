<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Perfil Pessoal</title>
  <style>
    /* Paleta de azul escuro + tons complementares */
    body {
      background: linear-gradient(135deg, #0b1d3f, #10294d);
      color: #d0e1ff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      background-color: #13294d;
      max-width: 700px;
      width: 100%;
      padding: 30px 40px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
    }

    h1, h2 {
      color: #74a9ff;
      font-weight: 700;
      margin-bottom: 20px;
      transition: color 0.3s ease;
      cursor: default;
    }

    h1:hover, h2:hover {
      color: #a2caff;
    }

    p, li {
      font-size: 1.1em;
      line-height: 1.6;
      margin-bottom: 12px;
    }

    strong {
      color: #a2caff;
    }

    ul {
      list-style-type: none;
      padding-left: 0;
      margin-top: 0;
    }

    a {
      display: inline-block;
      background-color: #3c5bbf;
      color: #d0e1ff;
      padding: 10px 18px;
      margin: 6px 12px 6px 0;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      box-shadow: 0 3px 6px rgba(60, 91, 191, 0.5);
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
    }

    a:hover {
      background-color: #5981ff;
      box-shadow: 0 5px 12px rgba(89, 129, 255, 0.7);
      color: #fff;
      text-decoration: underline;
    }

    iframe {
      width: 100%;
      height: 360px;
      border-radius: 12px;
      border: 3px solid #74a9ff;
      margin-bottom: 30px;
      box-shadow: 0 8px 20px rgba(116, 169, 255, 0.6);
      transition: transform 0.3s ease;
    }

/* Removido efeito hover do iframe */
/* iframe:hover {
  transform: scale(1.02);
} */

    @media (max-width: 600px) {
      .container {
        padding: 20px;
      }

      iframe {
        height: 200px;
      }

      a {
        padding: 8px 14px;
        font-size: 0.9em;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Ricardo - Perfil Pessoal</h1>
    <p><strong>Nome:</strong> Ricardo</p>
    <p><strong>Idade:</strong> 16 anos</p>
    <p><strong>Escolaridade:</strong> Cursando Ensino Médio</p>
    <p><strong>Cidade/Estado:</strong> Curitiba - Paraná</p>

  <h2>Vídeo que me inspira</h2>
  <iframe width="560" height="315" src="https://www.youtube.com/watch?v=ePdRgBWhvog" frameborder="0" allowfullscreen></iframe>

    <h2>Redes Sociais</h2>
    <ul>
      <li><a href="https://instagram.com/ricardo.marcato" target="_blank" rel="noopener noreferrer">Instagram</a></li>
      <li><a href="https://github.com/RicardoMedeirosMarcato" target="_blank" rel="noopener noreferrer">GitHub</a></li>
    </ul>
  </div>
</body>
</html>
